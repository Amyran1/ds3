[project]
name = "datascience2"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.0",
    "anthropic>=0.40",
    "cohere>=5.0",
    "pinecone[asyncio]>=5.0",
    "motor>=3.0",
    "aioboto3>=13.0",
    "boto3>=1.34",
    "tenacity>=8.0",
    "pydantic-settings>=2.0",
    "instructor>=1.0",
    "tqdm>=4.0",
    "pandas>=2.0",
    "polars>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "dask[distributed,dataframe]>=2024.1",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
    "torch>=2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pyright>=1.1",
    "kaggle>=1.6",
]

[tool.setuptools.packages.find]
include = ["libs*", "projects*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits real external APIs (deselect with -m 'not integration')"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "/Users/aaronmyran/dev/venvs"
venv = "datascience2"
extraPaths = ["."]
